name: Build and package

on:
  workflow_call:
    inputs:
      include_addons:
        description: Generate the Windows add-ons from the dedicated server's game files
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Build and test the Rust workspace
        shell: pwsh
        run: |
          rustup target add i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p inventory-mod-client --target i686-pc-windows-msvc

      - name: Download game files for the add-ons
        if: inputs.include_addons
        shell: pwsh
        timeout-minutes: 35
        run: |
          $steamDir = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $gameDir = Join-Path $env:RUNNER_TEMP 'l4d2-server'
          $zip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $steamDir

          $steamCmd = Join-Path $steamDir 'steamcmd.exe'
          $steamArgs = '+@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 +@sSteamCmdForcePlatformType windows +force_install_dir "{0}" +login anonymous +app_info_update 1 +app_info_print 222860 +app_update 222860 +quit' -f $gameDir
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Installing the dedicated server with SteamCMD (attempt $attempt)"
            # Wait for SteamCMD's self-update child process. The launcher can exit 7 after handing off.
            $steam = Start-Process -FilePath $steamCmd -WorkingDirectory $steamDir -ArgumentList $steamArgs -WindowStyle Hidden -Wait -PassThru
            $manifest = Get-Content (Join-Path $gameDir 'steamapps/appmanifest_222860.acf') -Raw -ErrorAction SilentlyContinue
            if ($steam.ExitCode -in 0, 7 -and $manifest -match '"StateFlags"\s+"4"' -and
                (Test-Path (Join-Path $gameDir 'update/pak01_dir.vpk')) -and
                (Test-Path (Join-Path $gameDir 'left4dead2/pak01_dir.vpk'))) {
              "L4D2_GAME_DIR=$gameDir" >> $env:GITHUB_ENV
              exit 0
            }
            Get-Content (Join-Path $steamDir 'logs/content_log.txt') -Tail 25 -ErrorAction SilentlyContinue
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          throw "SteamCMD could not install the dedicated server (exit $($steam.ExitCode))"

      - name: Package the player ZIP
        shell: pwsh
        env:
          INCLUDE_ADDONS: ${{ inputs.include_addons }}
        run: |
          $options = if ($env:INCLUDE_ADDONS -eq 'true') { @('--game', $env:L4D2_GAME_DIR) } else { @('--skip-addons') }
          cargo run --locked --release -p inventory-tools -- package-windows @options

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-mod-windows-x86
          path: dist/inventory-mod-windows-x86.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux dedicated server x86
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install x86 system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386
          rustup target add i686-unknown-linux-gnu

      - name: Build and test the Rust server
        shell: bash
        run: |
          cargo test --locked -p inventory-mod -p inventory-mod-server --target i686-unknown-linux-gnu
          cargo build --locked --release -p inventory-mod-server --target i686-unknown-linux-gnu

      - name: Package the dedicated server archive
        shell: bash
        run: cargo run --locked --release -p inventory-tools -- package-linux

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-mod-linux-x86
          path: dist/inventory-mod-linux-x86.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
