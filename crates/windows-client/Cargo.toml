[package]
name = "inventory-mod-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(all(windows, target_arch = "x86"))'.dependencies]
inventory-mod = { path = "../.." }
inventory-source-assets = { path = "../source-assets" }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "block_encoder"] }
image = { version = "0.25.9", default-features = false, features = ["bmp", "jpeg", "png"] }
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
