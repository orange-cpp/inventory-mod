[package]
name = "inventory-mod-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(all(target_os = "linux", target_arch = "x86"))'.dependencies]
inventory-mod = { path = "../.." }
libm = { version = "0.2.16", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
