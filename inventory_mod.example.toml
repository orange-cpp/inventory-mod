# The inventory's rules.  Copy this file next to inventory_mod.dll as inventory_mod.toml.
#
# On a dedicated server (srcds.exe) these are the rules for every player: the server decides what fits, and the
# players' game clients show its limits and weights.  In a game you host, it is your own and your guests' rules.
# Read when the DLL loads: reload the mod after a change.  Mistakes are written to the log with their line.

[limits]
slots = 24             # the most item boxes per player, 1 to 24: boxes appear as they are needed, so the weight below is what limits
weapon_slots = 8       # the most boxes for stored guns and melee weapons, 0 to 8 (apart from the item boxes)
max_weight = 30.0      # what everything you carry may weigh together; 0 = no weight limit

# What each item and weapon weighs ("weapon_" may be left out).  Those not listed keep the mod's default.
[weight]
first_aid_kit = 3.0
defibrillator = 3.0
pain_pills = 1.0
adrenaline = 1.0
pipe_bomb = 2.0
molotov = 2.0
vomitjar = 2.0
upgradepack_incendiary = 3.0
upgradepack_explosive = 3.0
gascan = 6.0
propanetank = 5.0
oxygentank = 5.0
fireworkcrate = 4.0
gnome = 2.0
cola_bottles = 4.0
# the gun and the melee weapon / pistol in your hands count too
pistol = 1.0
pistol_magnum = 1.5
melee = 2.0
chainsaw = 6.0
smg = 3.0
smg_silenced = 3.0
smg_mp5 = 3.0
pumpshotgun = 4.0
shotgun_chrome = 4.0
autoshotgun = 5.0
shotgun_spas = 5.0
rifle = 4.0
rifle_ak47 = 4.5
rifle_desert = 4.5
rifle_sg552 = 4.5
hunting_rifle = 5.0
sniper_military = 5.5
sniper_awp = 5.5
sniper_scout = 4.0
rifle_m60 = 8.0
grenade_launcher = 6.0

# How many of an item fit in one box (1 to 99).
[stack]
first_aid_kit = 2
pain_pills = 4
molotov = 3

# The most reserve rounds you can carry of each ammo type (the game's own ammo_<type>_max settings: ammo piles stop
# there too). Guns of one type share the reserve. Leave a line out to keep the game's default (the values below).
[ammo]
assault_rifle = 360     # M16, AK-47, SCAR, SG552
smg = 650               # SMG, silenced SMG, MP5
shotgun = 72            # pump and chrome shotgun
auto_shotgun = 90       # auto and combat shotgun
hunting_rifle = 150
sniper_rifle = 180      # military sniper, AWP, Scout
grenade_launcher = 30
m60 = 0
chainsaw = 20

# What one reserve round weighs: the rounds you carry count against max_weight (360 rifle rounds at 0.01 weigh 3.6).
# An ammo pile then fills you only up to the weight limit. 0: that type weighs nothing. The Items tab of the window
# lists your rounds and drops them, a magazine's worth or all, as an ammo pile anyone can pick up with E.
[round_weight]
assault_rifle = 0.01
smg = 0.006
shotgun = 0.04
auto_shotgun = 0.04
hunting_rifle = 0.02
sniper_rifle = 0.02
grenade_launcher = 0.15
m60 = 0.01

# The infection: knocked down by the infected, grabbed by a special (smoker, hunter, jockey, charger) or vomited on by
# a boomer, a survivor is infected and a clock starts. A new hit takes time off; pain pills put the clock back to the
# start. When the clock runs out the survivor dies and a random special infected rises where they stood, and they cannot
# come back before the next chapter (no defibrillator, no rescue closet). Their sight sickens as time runs out.
[infection]
enabled = true
seconds = 120          # the clock
hit_seconds = 20       # what each new grab / vomit / knock-down takes off a running clock
specials = ["smoker", "boomer", "hunter", "spitter", "jockey", "charger"]   # what may rise
bots = false           # the survivor bots too
no_cure = true         # pain pills only put the clock back to the start (false: they cure)
cough = true           # the infected cough now and then (everyone hears it), more often as the clock runs out
insane = true          # near the end they go insane: laugh for no reason, scream (everyone hears it)
insane_at = 70         # from this much (%) of the clock gone

# Stamina: running, jumping, melee swings and shoves use it (0 .. 100); it comes back after a moment's rest. A survivor
# who runs out is exhausted until it is back to `recover`: slower, slower to swing and shove, and their melee hits do
# less damage. How it shows (a bar, a vignette) is each player's inventory_mod_settings.toml.
[stamina]
enabled = true
run = 8                # used per second of running
jump = 12              # per jump
swing = 10             # per melee swing
shove = 8              # per shove
regen = 20             # back per second of rest
regen_delay = 1.0      # seconds after the last use before it comes back
recover = 30           # exhausted until it is back to this much
slow = 60              # exhausted: % of the normal speed
swing_speed = 60       # exhausted: % of the normal swing and shove rate
damage = 50            # exhausted: % of the normal melee damage
bots = false           # the survivor bots too

# Melee, as in No More Room in Hell 2. Hold the attack with a melee weapon to wind the swing up, let go to swing: let go
# before heavy_hold seconds it is a light swing, after it a heavy one (more damage, more stamina, a longer wait). Winding
# up slows you and tires you; run out and the swing goes off by itself. A shove while winding up calls the swing off;
# the reload key while winding up throws the weapon. A swing let go while the weapon is still recovering is dropped. A light swing does not kill a common by itself; only the head kills (head_only). One swing into a crowd does
# less to each further one. Hold the reload key to block the commons' hits from the front (just in time: a deflect);
# hold the shove for a heavy shove that knocks them back. Weapons wear out and break. Each weapon has a class
# (blade_1h, blunt_1h, blade_2h, blunt_2h) that scales these numbers; [melee.weapons.<name>] sets one weapon's own.
# Winding up, the heavy shove and the throw need the mod on the player's game; without it every swing is a light one.
[melee]
enabled = true
heavy_hold = 0.6       # seconds the attack is held for a heavy swing (times the class's: two-handers longer)
heavy_damage = 200     # % of a full hit a heavy swing does (a full hit: a common's health; others: the game's damage)
heavy_recovery = 150   # % of the weapon's wait after a heavy swing
heavy_stamina = 25     # with [stamina]: what a heavy swing costs (instead of its `swing`)
light_damage = 40      # % of a full hit a light swing does (a common takes about three to the body)
head_damage = 200      # % on a hit to the head, on top of light / heavy (two light ones, one heavy)
head_only = true       # a common is killed only by a hit to the head (the body leaves it at 1 health)
cleave = 70            # each further target of one swing takes this % of what the one before took (blades more)
cleave_min = 30        # but never less than this % of what the first took
wind_speed = 65        # % of the normal speed while winding up (eased in as the swing charges)
wind_stamina = 4       # with [stamina]: used per second of winding up
hit_stamina = 3        # with [stamina]: used per target hit
durability = 100       # % of each class's durability (blades 150 / 200 hits, blunt 250 / 300); 0: never break
block = 25             # % of a common's hit taken while blocking it from the front (the reload key)
block_stamina = 6      # with [stamina]: used per blocked hit; exhausted, no block
block_speed = 60       # % of the normal speed while blocking
deflect = 0.25         # seconds: a block raised this recently takes nothing and staggers the common
heavy_shove_hold = 0.5 # seconds the shove is held for a heavy shove (0: none)
heavy_shove_stamina = 20  # with [stamina]: what a heavy shove costs (instead of its `shove`)
throw_damage = 250     # % of a full hit a thrown weapon does
throw_speed = 900      # how fast it flies
view_punch = 3         # degrees your view kicks on a heavy hit (a light one a third)
overhead = true        # a heavy swing comes down from above where the weapon has such a swing
gesture = true         # others see your weapon raised while you wind up

# Each feature on or off (all on when left out):
heavy = true           # heavy swings (false: no wind-up, every swing light, and no throw)
wind_slowdown = true   # winding up slows you (wind_speed)
blocking = true        # the reload key blocks a common's hit
deflecting = true      # a block raised just in time takes nothing and staggers (deflect)
heavy_shove = true     # a held shove is a heavy shove
throwing = true        # the reload key while winding up throws the weapon
breaking = true        # weapons wear and break (durability)
hit_stagger = true     # a heavy hit staggers what it does not kill
view_kick = true       # your view kicks on a hit (view_punch)
wall_bounce = true     # a swing into a wall stops short: your view kicks, the weapon wears more

# One weapon's own numbers (class, heavy_hold, light_damage, heavy_damage, cleave, stamina %, durability in hits):
# [melee.weapons.frying_pan]
# durability = 400

# Ammo piles: a map's ammo pile is not endless. It holds a random ammo type of `kinds`, min_magazines to max_magazines
# magazines of it (rolled on its first use, then it is tinted that type's colour). Anyone takes as many as they can
# carry (the type's most, the weight limit; a bot only for a gun it has), the rest stays; an empty pile is gone.
[ammo_piles]
enabled = true
min_magazines = 1
max_magazines = 3
kinds = ["assault_rifle", "smg", "shotgun", "auto_shotgun", "hunting_rifle", "sniper_rifle", "grenade_launcher"]
replace_map_piles = true   # when a round starts, each of the map's piles becomes a pack of its rolled type
extra = 4                  # and this many more packs go beside the map's item spots (pills, throwables, guns)

# Map guns: a gun nobody has held yet (lying in the map, or from a weapon spawner) has only min_clip to max_clip % of
# its magazine when it is first picked up. A gun someone has held keeps its own.
[map_guns]
enabled = true
min_clip = 10
max_clip = 60
spawners_once = true   # a weapon spawner (guns, melee weapons) gives one, then it is gone
min_reserve = 0        # what such a gun adds to your reserve: min_reserve..max_reserve magazines
max_reserve = 1        # (the game would fill it)
